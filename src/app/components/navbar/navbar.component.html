<header class="navbar-wrapper" [class.navbar-wrapper--scrolled]="scrolled()">
  <div class="container navbar-inner">
    <!-- Brand Mark -->
    <a class="brand-badge" routerLink="/" (click)="closeMobileMenu()" aria-label="NIEL Construction Home">
      <svg class="brand-mark" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2L20 6.5V11.5L12 7L4 11.5V6.5L12 2Z" fill="#FF3B1D"/>
        <path d="M4 12.5L12 17L20 12.5V17.5L12 22L4 17.5V12.5Z" fill="#FFFFFF"/>
        <path d="M12 7L20 11.5L16 13.75L8 9.25L12 7Z" fill="#FF3B1D" fill-opacity="0.72"/>
      </svg>
      <span class="brand-wordmark">NIEL</span>
    </a>

    <!-- Desktop Navigation Pill -->
    <nav class="nav-dock" aria-label="Primary navigation">
      <ul class="nav-links">
        @for (item of navItems; track item.path) {
          <li>
            <a
              class="nav-link"
              [routerLink]="item.path"
              routerLinkActive="nav-link--active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
            >
              <span>{{ item.label }}</span>
              @if (item.badge) {
                <span class="nav-badge">{{ item.badge }}</span>
              }
            </a>
          </li>
        }
      </ul>

      <a class="btn-split btn-split--accent nav-cta" routerLink="/contact">
        <span>GET ESTIMATE</span>
        <span class="btn-split__arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M3 8H13M13 8L8.5 3.5M13 8L8.5 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>
    </nav>

    <!-- Mobile Menu Toggle -->
    <button
      class="mobile-toggle"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span class="mobile-toggle__line" [class.open-top]="mobileMenuOpen()"></span>
      <span class="mobile-toggle__line" [class.open-bottom]="mobileMenuOpen()"></span>
    </button>
  </div>

  <!-- Mobile Drawer -->
  @if (mobileMenuOpen()) {
    <div class="mobile-drawer">
      <ul class="mobile-drawer__links">
        @for (item of navItems; track item.path) {
          <li>
            <a
              class="mobile-drawer__link"
              [routerLink]="item.path"
              routerLinkActive="mobile-drawer__link--active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              (click)="closeMobileMenu()"
            >
              <span>{{ item.label }}</span>
              @if (item.badge) {
                <span class="nav-badge">{{ item.badge }}</span>
              }
            </a>
          </li>
        }
      </ul>
      <a
        class="btn-split btn-split--accent mobile-drawer__cta"
        routerLink="/contact"
        (click)="closeMobileMenu()"
      >
        <span>GET ESTIMATE</span>
        <span class="btn-split__arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M3 8H13M13 8L8.5 3.5M13 8L8.5 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>
    </div>
  }
</header>
