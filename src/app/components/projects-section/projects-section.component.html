<section id="projects" class="projects-section">
  <div class="container">
    <div class="projects-header">
      <div class="projects-header__left" data-aos="fade-down-right">
        <div class="status-pill status-pill--dark">
          <span class="status-dot" aria-hidden="true"></span>
          <span>SELECTED PROJECTS</span>
        </div>

        <h2 class="projects-title">
          <span class="projects-title__solid">Built to spec,</span>
          <span class="projects-title__muted"> on time and on budget.</span>
        </h2>
      </div>

      <div class="projects-header__right" data-aos="fade-down-left" data-aos-delay="100">
        <p class="projects-lead">
          A few recent builds across commercial, residential and civic work.
        </p>
        <a class="btn-split btn-split--white" routerLink="/projects">
          <span>VIEW ALL PROJECTS</span>
          <span class="btn-split__arrow" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M3 8H13M13 8L8.5 3.5M13 8L8.5 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </a>
      </div>
    </div>

    <div class="projects-bento">
      @for (project of projects; track project.code) {
        <a
          class="bento-card"
          [class.bento-card--featured]="$first"
          [routerLink]="['/projects', project.slug]"
          [attr.data-aos]="$first ? 'zoom-in-right' : ($index === 1 ? 'fade-up-left' : 'zoom-in-left')"
          [attr.data-aos-delay]="$index * 110"
        >
          <div class="bento-card__media">
            <img
              [src]="project.image"
              [alt]="project.title"
              class="bento-card__img"
              loading="lazy"
            />
          </div>

          <div class="bento-card__footer">
            <div class="bento-card__top">
              <h3 class="bento-card__title">{{ project.title }}</h3>
              <span class="bento-card__year">{{ project.year }}</span>
            </div>
            <div class="bento-card__meta">
              <span>{{ project.location }}</span>
              <span>{{ project.category }}</span>
            </div>
          </div>
        </a>
      }
    </div>
  </div>
</section>
